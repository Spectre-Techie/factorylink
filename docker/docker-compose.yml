version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
