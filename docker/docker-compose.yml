services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      AT_ENVIRONMENT: ${AT_ENVIRONMENT:-sandbox}
      AT_USERNAME: ${AT_USERNAME:?AT_USERNAME is required}
      AT_API_KEY: ${AT_API_KEY:?AT_API_KEY is required}
      AT_BASE_URL: ${AT_BASE_URL:-https://api.africastalking.com}
      AT_SENDER_ID: ${AT_SENDER_ID:-FactoryLink}
      AT_VOICE_NUMBER: ${AT_VOICE_NUMBER:-}
      VOICE_CALLBACK_URL: ${VOICE_CALLBACK_URL:-http://localhost:4000/api/africastalking/voice}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
